# Opens one release PR per module with pending changes (see release-please-config.json).
# Each created or updated release PR is also published as a snapshot of its version (e.g. 0.2.0-SNAPSHOT).
# Merging a release PR tags the module (e.g. sample-1.2.0) and publishes it to Reposilite (and npm).
name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      npm-releases: ${{ steps.plan.outputs.npm-releases }}
      snapshots: ${{ steps.snapshots.outputs.snapshots }}
      npm-snapshots: ${{ steps.snapshots.outputs.npm-snapshots }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # A PAT (or GitHub App token) is needed for the release PRs to trigger the PR checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout sources
        if: steps.release.outputs.releases_created == 'true' || steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v6

      - name: Plan the publications of the released modules
        id: plan
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          releases='[]'
          for module in $(jq -r '.paths_released | fromjson | .[]' <<< "$RELEASE_OUTPUTS"); do
            info="$(.github/scripts/module-info.sh "$module" | jq -R 'capture("^(?<key>[^=]+)=(?<value>.*)$")' | jq -s 'from_entries')"
            release="$(jq -c --arg m "$module" --argjson info "$info" \
              '$info + {version: .[$m + "--version"], sha: .[$m + "--sha"], tag: .[$m + "--tag_name"]}' <<< "$RELEASE_OUTPUTS")"
            releases="$(jq -c --argjson r "$release" '. + [$r]' <<< "$releases")"
          done
          echo "Releases: $releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "npm-releases=$(jq -c 'map(select(.npm == "true"))' <<< "$releases")" >> "$GITHUB_OUTPUT"

      # "prs" only lists the release PRs created or updated by this run (unchanged ones are omitted),
      # so a snapshot is published only when the content of a release PR changes.
      - name: Plan the snapshots of the created or updated release PRs
        id: snapshots
        if: steps.release.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          snapshots='[]'
          for branch in $(jq -r '.[].headBranchName' <<< "$PRS"); do
            component="${branch##*--components--}"
            module="$(jq -r --arg c "$component" '.packages | to_entries[] | select(.value.component == $c) | .key' release-please-config.json)"
            if [ -z "$module" ]; then
              echo "::warning::No module for the release PR branch $branch"
              continue
            fi
            git fetch --quiet --depth 1 origin "$branch"
            sha="$(git rev-parse FETCH_HEAD)"
            version="$(git show "$sha:$module/gradle.properties" | sed -n 's/^version=//p')"
            info="$(.github/scripts/module-info.sh "$module" | jq -R 'capture("^(?<key>[^=]+)=(?<value>.*)$")' | jq -s 'from_entries')"
            snapshot="$(jq -nc --argjson info "$info" --arg v "$version-SNAPSHOT" --arg sha "$sha" '$info + {version: $v, sha: $sha}')"
            snapshots="$(jq -c --argjson s "$snapshot" '. + [$s]' <<< "$snapshots")"
          done
          echo "Snapshots: $snapshots"
          echo "snapshots=$snapshots" >> "$GITHUB_OUTPUT"
          echo "npm-snapshots=$(jq -c 'map(select(.npm == "true"))' <<< "$snapshots")" >> "$GITHUB_OUTPUT"

  publish-maven:
    needs: release-please
    if: needs.release-please.outputs.releases != '' && needs.release-please.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-please.outputs.releases) }}
    permissions:
      contents: read
    uses: Infomaniak/.github/.github/workflows/kmp-publish-reposilite-release.yml@v2
    with:
      version: ${{ matrix.release.version }}
      # Tags are prefixed with the module name, so the reusable workflow cannot derive the commit from the version.
      commit-sha: ${{ matrix.release.sha }}
      gradle-task: ${{ matrix.release.gradle-task }}
      version-property: ${{ matrix.release.version-property }}
    secrets:
      REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
      REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.npm-releases != '' && needs.release-please.outputs.npm-releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-please.outputs.npm-releases) }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-npm.yml
    with:
      module: ${{ matrix.release.module }}
      version: ${{ matrix.release.version }}
      commit-sha: ${{ matrix.release.sha }}
      dist-tag: latest
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-snapshot-maven:
    needs: release-please
    if: needs.release-please.outputs.snapshots != '' && needs.release-please.outputs.snapshots != '[]'
    strategy:
      fail-fast: false
      matrix:
        snapshot: ${{ fromJSON(needs.release-please.outputs.snapshots) }}
    permissions:
      contents: read
    uses: Infomaniak/.github/.github/workflows/kmp-publish-reposilite-snapshot.yml@v2
    with:
      version: ${{ matrix.snapshot.version }}
      commit-sha: ${{ matrix.snapshot.sha }}
      gradle-task: ${{ matrix.snapshot.gradle-task }}
      version-property: ${{ matrix.snapshot.version-property }}
      lib-name: "Multiplatform Core ${{ matrix.snapshot.module }} (release PR)"
      artifact-line: ${{ matrix.snapshot.artifact-line }}
      maven-group-path: ${{ matrix.snapshot.maven-group-path }}
    secrets:
      REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
      REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
      KCHAT_KMP_WEBHOOK_URL: ${{ secrets.KCHAT_KMP_WEBHOOK_URL }}

  publish-snapshot-npm:
    needs: release-please
    if: needs.release-please.outputs.npm-snapshots != '' && needs.release-please.outputs.npm-snapshots != '[]'
    strategy:
      fail-fast: false
      matrix:
        snapshot: ${{ fromJSON(needs.release-please.outputs.npm-snapshots) }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-npm.yml
    with:
      module: ${{ matrix.snapshot.module }}
      version: ${{ matrix.snapshot.version }}
      commit-sha: ${{ matrix.snapshot.sha }}
      dist-tag: snapshot
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
