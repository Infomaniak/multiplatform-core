# Publishes the npm package of a Kotlin/JS module. Called by the release and snapshot workflows.
# Skipped until the NPM_REGISTRY_URL repository variable is set (see docs/PUBLISHING.md).
name: Publish to npm

on:
  workflow_call:
    inputs:
      module:
        description: 'Module path in release-please-config.json (e.g. features/Sample)'
        required: true
        type: string
      version:
        description: 'Module version (x.x.x or x.x.x-SNAPSHOT)'
        required: true
        type: string
      commit-sha:
        description: 'Commit SHA to build from'
        required: true
        type: string
      dist-tag:
        description: 'npm dist-tag (latest for releases, snapshot for snapshots)'
        required: true
        type: string
      publish-wasm:
        description: 'Include the Wasm distribution under the package /wasm entry point'
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

permissions: {}

jobs:
  publish:
    if: vars.NPM_REGISTRY_URL != ''
    runs-on: [self-hosted, Android]
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit-sha }}

      - name: Get module info
        id: module
        env:
          MODULE: ${{ inputs.module }}
        run: .github/scripts/module-info.sh "$MODULE" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the npm package
        env:
          GRADLE_PROJECT: ${{ steps.module.outputs.gradle-project }}
          VERSION_PROPERTY: ${{ steps.module.outputs.version-property }}
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
          PUBLISH_WASM: ${{ inputs.publish-wasm }}
        run: |
          tasks=("$GRADLE_PROJECT:jsBrowserProductionLibraryDistribution")
          if [ "$PUBLISH_WASM" = "true" ]; then
            tasks+=("$GRADLE_PROJECT:wasmJsBrowserProductionLibraryDistribution")
          fi
          ./gradlew "${tasks[@]}" \
            "-P$VERSION_PROPERTY=${{ inputs.version }}" \
            "-Ppublish.npmSnapshotId=${{ github.run_number }}.${{ github.run_attempt }}" \
            ${NPM_SCOPE:+"-Ppublish.npmScope=$NPM_SCOPE"}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: ${{ vars.NPM_REGISTRY_URL }}

      - name: Add Wasm distribution to the npm package
        if: inputs.publish-wasm
        env:
          MODULE: ${{ inputs.module }}
        run: |
          package_dir="$MODULE/build/dist/js/productionLibrary"
          wasm_dir="$MODULE/build/dist/wasmJs/productionLibrary"
          test -d "$wasm_dir"
          mkdir -p "$package_dir/wasm"
          cp -R "$wasm_dir/." "$package_dir/wasm/"
          node - "$package_dir" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const packageDir = process.argv[2];
          const packageJsonPath = path.join(packageDir, 'package.json');
          const wasmPackageJsonPath = path.join(packageDir, 'wasm', 'package.json');
          const pkg = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          const wasm = JSON.parse(fs.readFileSync(wasmPackageJsonPath, 'utf8'));
          pkg.exports = {
            '.': { types: `./${pkg.types}`, import: `./${pkg.main}` },
            './wasm': { types: `./wasm/${wasm.types}`, import: `./wasm/${wasm.main}` },
            './*': './*',
          };
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.unlinkSync(wasmPackageJsonPath);
          NODE

      - name: Publish the npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ACCESS: ${{ vars.NPM_ACCESS }}
        run: |
          npm publish "${{ inputs.module }}/build/dist/js/productionLibrary" \
            --tag "${{ inputs.dist-tag }}" ${NPM_ACCESS:+--access "$NPM_ACCESS"}
